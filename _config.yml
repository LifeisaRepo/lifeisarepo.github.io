#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: life is a repo
email: sanjyot.code@gmail.com
description: >-
  Games programmer building real-time experiences — games, XR, virtual production, and GenAI.
baseurl: ""
url: "https://lifeisarepo.github.io"
github_username: LifeisaRepo
linkedin_username: sanjyot-dahale

# Default social-preview card, used when a page has no image of its own.
# Must be 1200x630. See _includes/head-meta.html for the resolution order.
og_image: "/assets/images/og-default.png"

google_site_verification: "ONwa3ytefd0nplYNn7heS-mqjI1lEzdvlJWU8J7peg4"

# GoatCounter — privacy-friendly visit counts. Dashboard:
#   https://lifeisarepo.goatcounter.com
goatcounter_url: "https://lifeisarepo.goatcounter.com/count"

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name/

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - design_handoff_portfolio_site/
  - Portfolio_Session_Log.md
  - MR_Project_Answers_For_Claude.md
  - CLAUDE.md
  - _design_system/
