{% assign images = include.images | split: "," %}
{% assign captions = include.captions | split: "::" %}
<div class="carousel-container">
    <div class="carousel-track">
        {% for img in images %}
        <div class="carousel-slide {% if forloop.first %}active{% endif %}">
            <img src="{{ img | strip }}" alt="Project Image" data-caption="{{ captions[forloop.index0] | default: '' }}">
            {% if captions[forloop.index0] %}
            <div class="carousel-caption">{{ captions[forloop.index0] }}</div>
            {% endif %}
        </div>
        {% endfor %}
    </div>
    
    {% if images.size > 1 %}
    <button class="carousel-btn prev" aria-label="Previous Slide">❮</button>
    <button class="carousel-btn next" aria-label="Next Slide">❯</button>
    
    <div class="carousel-dots">
        {% for img in images %}
        <span class="dot {% if forloop.first %}active{% endif %}" data-index="{{ forloop.index0 }}"></span>
        {% endfor %}
    </div>
    {% endif %}
</div>

<!-- Lightbox comes from the shared window.Lightbox widget (assets/js/lightbox.js),
     loaded by the layout. This include only wires the carousel + hands it images. -->
<script>
(function() {
    if (window.carouselScriptLoaded) return;
    window.carouselScriptLoaded = true;

    document.addEventListener('DOMContentLoaded', function() {
        const lb = window.Lightbox && window.Lightbox.create();
        const carousels = document.querySelectorAll('.carousel-container');

        carousels.forEach(carousel => {
            const slides = carousel.querySelectorAll('.carousel-slide');
            const nextBtn = carousel.querySelector('.next');
            const prevBtn = carousel.querySelector('.prev');
            const dots = carousel.querySelectorAll('.dot');

            // Gather all image sources and captions for this carousel
            const images = Array.from(slides).map(slide => slide.querySelector('img').src);
            const captions = Array.from(slides).map(slide => slide.querySelector('img').getAttribute('data-caption') || '');
            const items = images.map((src, i) => ({ src, caption: captions[i] }));

            let currentIndex = 0;

            function updateCarousel(index) {
                slides.forEach(slide => slide.classList.remove('active'));
                dots.forEach(dot => dot.classList.remove('active'));

                slides[index].classList.add('active');
                if(dots.length > index) dots[index].classList.add('active'); // Checks if dots exist

                currentIndex = index;
            }

            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    let newIndex = currentIndex + 1;
                    if (newIndex >= slides.length) newIndex = 0;
                    updateCarousel(newIndex);
                });
            }

            if (prevBtn) {
                prevBtn.addEventListener('click', () => {
                    let newIndex = currentIndex - 1;
                    if (newIndex < 0) newIndex = slides.length - 1;
                    updateCarousel(newIndex);
                });
            }

            if (dots) {
                dots.forEach(dot => {
                    dot.addEventListener('click', (e) => {
                        const index = parseInt(e.target.dataset.index);
                        updateCarousel(index);
                    });
                });
            }

            // Add click event to images to open lightbox
            slides.forEach((slide, index) => {
                const img = slide.querySelector('img');
                img.style.cursor = 'pointer';
                img.addEventListener('click', () => {
                    if (lb) lb.open(items, index);
                });
            });
        });
    });
})();
</script>
