<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title | default: "Sanjyot Dahale" }} — Gameplay Programmer</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Sansation:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
</head>
<body data-palette="amber" data-type="grotesk">
  <div class="vp-frame" aria-hidden="true">
    <span class="vp-corner tl"></span><span class="vp-corner tr"></span>
    <span class="vp-corner bl"></span><span class="vp-corner br"></span>
  </div>

  {% include header.html %}

  <main class="main-content">
    {{ content }}
  </main>

  {% include footer.html %}
  <script src="{{ '/assets/js/nav.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
